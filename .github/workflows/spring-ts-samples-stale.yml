name: spring-ts samples stale gate

on:
  pull_request:
    paths:
      - "lib/spring-ts/data/narrative/**"
      - "lib/spring-ts/src/**"
      - "lib/spring-ts/artifacts/sample-outputs-2026-05-05-phase3/**"
      - "lib/spring-ts/tools/check_samples_stale.mjs"
      - "lib/spring-ts/tools/regen_samples.mjs"
      - "lib/saju-ts/src/**"
      - ".github/workflows/spring-ts-samples-stale.yml"
  push:
    branches: ["main"]
    paths:
      - "lib/spring-ts/data/narrative/**"
      - "lib/spring-ts/src/**"
      - "lib/spring-ts/artifacts/sample-outputs-2026-05-05-phase3/**"
      - "lib/spring-ts/tools/check_samples_stale.mjs"
      - "lib/spring-ts/tools/regen_samples.mjs"
      - "lib/saju-ts/src/**"
      - ".github/workflows/spring-ts-samples-stale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spring-ts-samples-stale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            lib/saju-ts/package-lock.json
            lib/spring-ts/package-lock.json

      # P17-A2 caveat (commit 6cf1130): ci:samples-stale invokes
      # `npm --prefix ../saju-ts run build` which needs `tsc` from
      # saju-ts node_modules. Install saju-ts deps before invoking
      # the gate from lib/spring-ts.
      - name: Install lib/saju-ts dependencies
        working-directory: lib/saju-ts
        run: npm install

      - name: Install lib/spring-ts dependencies
        working-directory: lib/spring-ts
        run: npm ci

      - name: Run samples-stale gate
        working-directory: lib/spring-ts
        run: npm run ci:samples-stale
