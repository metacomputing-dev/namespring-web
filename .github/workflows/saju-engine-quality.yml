name: Saju Engine Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saju-engine-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Engine regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            namespring/package-lock.json
            lib/saju-ts/package-lock.json
            lib/seed-ts/package-lock.json
            lib/spring-ts/package-lock.json

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firestore emulator binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('namespring/package-lock.json') }}

      - name: Install saju engine dependencies
        working-directory: lib/saju-ts
        run: npm ci

      - name: Install Seed repository dependencies
        working-directory: lib/seed-ts
        run: npm ci

      - name: Install report adapter dependencies
        working-directory: lib/spring-ts
        run: npm ci

      - name: Install application dependencies
        working-directory: namespring
        run: npm ci

      - name: Verify backend API contracts
        working-directory: namespring
        run: |
          npm run typecheck:backend
          npm run test:backend-contracts
          npm run audit:production

      - name: Verify durable maintenance with Firestore emulator
        working-directory: namespring
        run: npm run test:emulator:maintenance

      - name: Verify Seed repository contracts
        working-directory: lib/seed-ts
        run: npm test

      - name: Typecheck, test, and build saju engine
        working-directory: lib/saju-ts
        run: |
          npm run typecheck
          npm run test:ci
          npm run build
          npm run validate:all

      - name: Verify adapter release regression suite
        working-directory: lib/spring-ts
        run: |
          npm run typecheck
          npm run typecheck:saju-bridge
          npm run build
          npm run test:saju-engine-release

      - name: Pack generated report assets
        working-directory: lib/spring-ts
        run: npx --no-install tsx tools/generation/pack-generated.ts

      - name: Build Vite application from workspace sources
        working-directory: namespring
        env:
          VITE_BASE_PATH: /ci/
        run: npm run build:pages

      - name: Prepare and verify Pages artifact
        run: |
          cp namespring/dist/index.html namespring/dist/404.html
          node .github/scripts/verify-pages-artifact.mjs --base "/ci/"

      - name: Ensure regression checks did not rewrite tracked evidence
        if: always()
        run: git diff --exit-code

  expert-readiness:
    name: Expert readiness (fail closed)
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            lib/saju-ts/package-lock.json
            lib/seed-ts/package-lock.json
            lib/spring-ts/package-lock.json

      - name: Install saju engine dependencies
        working-directory: lib/saju-ts
        run: npm ci

      - name: Install Seed repository dependencies
        working-directory: lib/seed-ts
        run: npm ci

      - name: Install report adapter dependencies
        working-directory: lib/spring-ts
        run: npm ci

      - name: Run authority, provenance, and exact-diff gates
        working-directory: lib/spring-ts
        shell: bash
        env:
          COMPOSITE_GATE_BASELINE_REF: origin/main
          COMPOSITE_GATE_BRANCH_REF: HEAD
        run: |
          status=0
          npm --prefix ../saju-ts run test:release-tools || status=1
          npm --prefix ../saju-ts run validate:school-sources || status=1
          npm run test:jonggyeok-authority:release || status=1
          node tools/measure_default_change.mjs --baseline origin/main --branch HEAD || status=1
          npm run quality:gate:release || status=1
          npm run test:composite-quality-gate || status=1
          exit "$status"

      - name: Ensure readiness gates did not rewrite tracked evidence
        if: always()
        run: git diff --exit-code
