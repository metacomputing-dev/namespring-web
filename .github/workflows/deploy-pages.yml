name: Deploy Namespring To GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            namespring/package-lock.json
            lib/seed-ts/package-lock.json
            lib/spring-ts/package-lock.json
            lib/saju-ts/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install lib/saju-ts dependencies
        working-directory: lib/saju-ts
        run: npm ci

      - name: Install lib/seed-ts dependencies
        working-directory: lib/seed-ts
        run: npm ci

      - name: Install lib/spring-ts dependencies
        working-directory: lib/spring-ts
        run: npm ci

      - name: Install namespring dependencies
        working-directory: namespring
        run: npm ci

      - name: Verify database and WASM source assets
        working-directory: lib/seed-ts
        run: |
          npm run check:database-asset-manifest
          npm run test:sql-js-wasm-asset

      - name: Verify compact NameStat source asset
        working-directory: lib/spring-ts
        run: npm run check:name-stat-summary

      - name: Pack generated report assets
        working-directory: lib/spring-ts
        run: npx --no-install tsx tools/generation/pack-generated.ts

      - name: Build namespring (project pages base path)
        working-directory: namespring
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_PAYMENT_APP_ORIGIN: ${{ vars.VITE_PAYMENT_APP_ORIGIN }}
          VITE_CANONICAL_ORIGIN: ${{ vars.VITE_CANONICAL_ORIGIN }}
        run: npm run build:pages

      - name: Prepare and verify Pages artifact
        run: |
          cp namespring/dist/index.html namespring/dist/404.html
          node .github/scripts/verify-pages-artifact.mjs --base "/${{ github.event.repository.name }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: namespring/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
